name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: |
          go mod verify
          go mod tidy -diff
          go build ./...
          go vet ./...
          go test -race -count=1 ./...
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          echo 'cb0da6751c2b753a16ac168bb354870ebb1e162e9083f116729cec9c781156b8  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          export TIMEPIN_COMMUNITY_STORE="$RUNNER_TEMP/community.p12"
          export TIMEPIN_COMMUNITY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$TIMEPIN_COMMUNITY_STORE" -storetype PKCS12 -storepass:env TIMEPIN_COMMUNITY_PASSWORD -alias timepin-community -keyalg RSA -keysize 3072 -validity 3 -dname CN=CI
          ./android/gradlew -p android :app:assembleCommunity :app:assembleAcceptanceAndroidTest :app:lintDebug
